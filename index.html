<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord Cropper</title>
  </head>
  <body>
    <main>
      <div class="page-heading">
        <img class="logo" src="/favicon.svg" alt="" aria-hidden="true" />
        <h1>Discord Profile Cropper</h1>
      </div>
      <p>
        Finally, an all-in-one place where you can crop your profiles to your
        hearts and actually have it come out right!
      </p>
      <section class="profile-card">
        <div class="profile">
          <div class="profile-header">
            <div class="profile-banner">
              <img
                crossorigin="anonymous"
                src="https://placehold.co/1100x440"
                alt=""
              />
            </div>
            <div class="profile-avatar">
              <div class="profile-picture">
                <img
                  crossorigin="anonymous"
                  src="https://placehold.co/512x512"
                  alt=""
                />
              </div>
              <span class="profile-status" aria-hidden="true"></span>
            </div>
          </div>

          <div class="profile-body">
            <div class="upload-actions">
              <label class="upload-button">
                <input
                  type="file"
                  accept="image/*"
                  data-upload="avatar"
                  hidden
                />
                <span>Upload Profile Picture</span>
              </label>
              <label class="upload-button">
                <input
                  type="file"
                  accept="image/*"
                  data-upload="banner"
                  hidden
                />
                <span>Upload Banner</span>
              </label>
              <button
                type="button"
                class="upload-button download-button"
                data-action="download"
                disabled
              >
                <span>Download ZIP</span>
              </button>
            </div>
            <div class="mobile-crop-controls" aria-label="Touch crop controls">
              <label class="zoom-control">
                <span>Profile picture zoom</span>
                <input
                  type="range"
                  min="1"
                  max="5"
                  step="0.01"
                  value="1"
                  data-zoom="avatar"
                  disabled
                />
              </label>
              <label class="zoom-control">
                <span>Banner zoom</span>
                <input
                  type="range"
                  min="1"
                  max="5"
                  step="0.01"
                  value="1"
                  data-zoom="banner"
                  disabled
                />
              </label>
            </div>
          </div>
        </div>
      </section>
      <p class="crop-help">
        Upload an image, then drag to reposition it. Pinch or use the mobile
        sliders to zoom on touchscreens, or use the mouse wheel on desktop.
      </p>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
